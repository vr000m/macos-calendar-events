name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: macOS / Python ${{ matrix.python }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Lint, types, tests, guards
        run: >-
          uv run ruff check . &&
          uv run ruff format --check . &&
          uv run mypy &&
          uv run pytest -m "not live" &&
          bash scripts/check_readonly.sh &&
          bash scripts/check_privacy.sh

  linux:
    name: Linux / Python 3.12 (import guard, non-darwin paths)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -m "not live"
